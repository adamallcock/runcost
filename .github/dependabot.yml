version: 2
# Each configured package directory opens at most one grouped pull request.
# Dependabot rebases that branch as new versions land instead of opening a
# branch per dependency, so the branch list remains bounded and reviewable.
# Security-update pull requests are unaffected by these limits, but they require
# Dependabot alerts and security updates to be enabled in repository Settings.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      npm:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/playground"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      playground-npm:
        patterns:
          - "*"
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      pip:
        patterns:
          - "*"
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      gomod:
        patterns:
          - "*"
