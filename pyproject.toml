[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "runcost-ai"
version = "0.2.0"
description = "Auditable LLM API cost calculator and batch ledger for provider responses."
requires-python = ">=3.9"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["llm", "ai", "pricing", "calculator", "tokens", "cost", "ledger", "batch", "agents", "openai", "anthropic", "gemini", "bedrock", "opentelemetry", "usage"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries"
]

[project.urls]
Homepage = "https://github.com/adamallcock/runcost"
Repository = "https://github.com/adamallcock/runcost"
Issues = "https://github.com/adamallcock/runcost/issues"
Changelog = "https://github.com/adamallcock/runcost/blob/main/CHANGELOG.md"

[project.scripts]
runcost = "runcost.cli:main"

[project.optional-dependencies]
smoke = [
  "langchain-core",
  "langchain-openai>=1.3.4"
]

[tool.setuptools.packages.find]
where = ["packages/python"]
