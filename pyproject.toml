[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "runcost-ai"
version = "0.2.2"
description = "Local, auditable and itemized USD cost ledger for LLM provider responses, with price sources and warnings."
requires-python = ">=3.9"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "tzdata; sys_platform == 'win32'",
]
keywords = ["llm", "ai", "pricing", "calculator", "tokens", "cost", "ledger", "audit", "local", "provenance", "reconciliation", "cost-accounting", "llm-cost", "api-cost", "cost-tracking", "cached-tokens", "reasoning-tokens", "batch", "agents", "openai", "anthropic", "gemini", "bedrock", "opentelemetry", "usage"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries"
]

[project.urls]
Homepage = "https://github.com/adamallcock/runcost"
Repository = "https://github.com/adamallcock/runcost"
Issues = "https://github.com/adamallcock/runcost/issues"
Changelog = "https://github.com/adamallcock/runcost/blob/main/CHANGELOG.md"

[project.scripts]
runcost = "runcost.cli:main"

[project.optional-dependencies]
smoke = [
  "langchain-core",
  "langchain-openai>=1.3.4"
]

[tool.setuptools.packages.find]
where = ["packages/python"]
